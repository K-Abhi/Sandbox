<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Table</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.datatables.net/2.2.2/css/dataTables.bootstrap5.min.css" rel="stylesheet" />

  <style>
    body {
      background: #f4f6f8;
      padding: 2rem 1rem 3rem;
    }
    .page-wrap {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      border: 0;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    h1 { font-weight: 700; }
    .table thead th { white-space: nowrap; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="mb-4">
      <h1 class="mb-1">Integration and Observability Agent Adoption Dashboard</h1>
      <p class="text-muted mb-0">Search, sort, and filter the dataset.</p>
    </div>

    <div class="card p-3 p-md-4">
      <div class="table-responsive">
        <table id="data-table" class="table table-striped table-hover nowrap" style="width:100%">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/2.2.2/js/dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/2.2.2/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    Papa.parse("Intobsdata.csv", {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function (results) {
        const rows = results.data;
        if (!rows.length) return;

        const columns = Object.keys(rows[0]).map(key => ({
          title: key,
          data: key
        }));

        new DataTable("#data-table", {
          data: rows,
          columns: columns,
          pageLength: 25,
          lengthMenu: [10, 25, 50, 100],
          responsive: true,
          order: [],
          language: {
            search: "Filter:",
            searchPlaceholder: "Type to search…"
          }
        });
      }
    });
  </script>
</body>
</html>
